name: CI

on:
  push:
    branches: [main, development, qa]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    # Unit + контракт API + эталонные проверки (уменьшенные) на Linux и macOS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not e2e" -q

  smoke:
    # Приложение действительно стартует и отвечает так, как его запускает пользователь
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Запуск run.py и запрос к API
        run: |
          python run.py --no-browser --port 8000 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/api/state > state.json && break; sleep 0.5; done
          python -c "import json; s = json.load(open('state.json')); assert s['phase'] == 'idle', s"
          curl -sf -X POST http://127.0.0.1:8000/api/command/step > /dev/null

  e2e:
    # Сквозные тесты в браузере: страница → HTTP → ViewModel → Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e -q

  verification:
    # Полный отчёт о верификации (несколько минут) — для main и по кнопке
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m verification
      - uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: |
            docs/VERIFICATION.md
            docs/img/verification_*.png
            docs/img/experiment_*.png
