[project]
name = "lj-md"
version = "1.1.0"
description = "MD: атомы в ячейке с потенциалом Леннард-Джонса — веб-приложение (MVVM)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "flask>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: сквозные тесты в браузере (нужен Playwright + Chromium)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
